main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/warehousemanagement
main.datasource.username=sa
main.datasource.password=

main.liquibase.change-log=com/company/warehousemanagement/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/company/warehousemanagement/menu.xml
jmix.ui.composite-menu=false

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=en,vi_VN

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn

# SMTP configuration. Keep credentials outside source control and provide them as
# environment variables when starting the application.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:30000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:30000}
jmix.email.from-address=${MAIL_FROM:${MAIL_USERNAME:}}

# Incoming mailbox (IMAP) shown behind the envelope icon in the header.
# SMTP above only SENDS mail; reading mail needs IMAP. Provide everything as environment
# variables - never commit credentials. Without INBOX_IMAP_HOST and credentials the
# inbox panel shows "Email not configured" and no mail is displayed.
khoflow.inbox.imap.host=${INBOX_IMAP_HOST:}
khoflow.inbox.imap.port=${INBOX_IMAP_PORT:993}
khoflow.inbox.imap.ssl=${INBOX_IMAP_SSL:true}
khoflow.inbox.imap.starttls=${INBOX_IMAP_STARTTLS:false}
khoflow.inbox.imap.username=${INBOX_IMAP_USERNAME:${MAIL_USERNAME:}}
khoflow.inbox.imap.password=${INBOX_IMAP_PASSWORD:${MAIL_PASSWORD:}}
khoflow.inbox.imap.folder=${INBOX_IMAP_FOLDER:INBOX}
khoflow.inbox.imap.connection-timeout-ms=${INBOX_IMAP_CONNECTION_TIMEOUT:5000}
khoflow.inbox.imap.read-timeout-ms=${INBOX_IMAP_READ_TIMEOUT:10000}
khoflow.inbox.unread-cache-seconds=${INBOX_UNREAD_CACHE_SECONDS:60}
