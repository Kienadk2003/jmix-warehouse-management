main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/warehousemanagement_test
main.datasource.username=sa
main.datasource.password=

# Tests must use compiled sources, not classes/XML hot-deployed by an open Studio session.
jmix.core.hot-deploy-enabled=false
jmix.core.conf-dir=.jmix/test-conf

# The Emailer is mocked in integration tests, but valid values keep the
# application-level SMTP preflight check deterministic.
spring.mail.host=smtp.test.local
spring.mail.username=test@example.com
spring.mail.password=test-password
jmix.email.from-address=test@example.com
